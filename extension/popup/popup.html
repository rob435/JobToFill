<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobToFill</title>
  <link rel="stylesheet" href="../ui/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <img src="../icons/icon32.png" alt="" width="22" height="22">
    <strong>JobToFill</strong>
    <select id="profile" aria-label="Active profile" title="Active profile"></select>
  </header>

  <main>
    <button id="fill" class="primary big">
      <span>Fill this page</span>
      <kbd id="shortcut" hidden></kbd>
    </button>
    <p id="page-note" class="note" hidden></p>

    <section id="result" class="card" hidden aria-live="polite"></section>

    <div class="tools">
      <button id="inspect" class="tool" title="Label every field with what JobToFill thinks it is">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 0 4.4 12.4l4.1 4.1 1.4-1.4-4.1-4.1A7 7 0 0 0 11 4Zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z"/></svg>
        <span>Show detected fields</span>
      </button>
      <button id="learn" class="tool" title="Save answers you typed on this page for next time">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3Zm-7 9.2V16c0 2.2 3.1 4 7 4s7-1.8 7-4v-3.8l-7 3.8-7-3.8Z"/></svg>
        <span>Learn from this page</span>
      </button>
    </div>

    <section id="learn-panel" class="card" hidden>
      <div class="card-head">
        <strong>Save for next time</strong>
        <button id="learn-close" class="link" type="button">Close</button>
      </div>
      <p id="learn-empty" class="muted small" hidden>Nothing new to learn here. Type your answers into the form first, then try again.</p>
      <ul id="learn-list" class="learn-list"></ul>
      <button id="learn-save" class="primary" hidden>Save selected</button>
    </section>

    <section id="vault" class="vault"></section>
  </main>

  <footer>
    <button id="open-options" class="link" type="button">Edit profile &amp; settings</button>
    <span id="version" class="muted"></span>
  </footer>

  <script src="../lib/util.js"></script>
  <script src="../lib/geo.js"></script>
  <script src="../lib/fields.js"></script>
  <script src="../lib/matcher.js"></script>
  <script src="../lib/vault.js"></script>
  <script src="../lib/store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
