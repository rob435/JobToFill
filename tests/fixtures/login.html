<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign In - Careers</title>
  <style>body { font: 14px system-ui; max-width: 420px; margin: 24px auto; } label { display: block; margin: 10px 0; } input { display: block; width: 100%; }</style>
</head>
<body>
  <h1>Sign in</h1>
  <form id="login">
    <label for="user">Username</label><input type="text" name="username" id="user">
    <label for="pw">Password</label><input type="password" name="pw" id="pw" autocomplete="current-password">
    <button type="submit">Sign In</button>
  </form>
</body>
</html>
