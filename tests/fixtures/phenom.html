<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Applying for a job | Marsh McLennan careers</title>
    <style>
      body { font: 15px/1.5 "Noto Sans", system-ui, sans-serif; margin: 0; color: #333; }
      .phenom-form-container { max-width: 1100px; margin: 24px auto; padding: 0 24px; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      .progressbarlist { display: flex; list-style: none; padding: 0; gap: 24px; }
      .row { display: flex; flex-wrap: wrap; align-items: flex-start; margin: 10px 0; }
      .col-md-5, .col-lg-5 { width: 38%; text-align: right; padding-right: 16px; box-sizing: border-box; }
      .col-md-7, .col-lg-7 { width: 58%; }
      .col-11 { width: 90%; }
      .col-1 { width: 8%; }
      .form-control { width: 100%; box-sizing: border-box; padding: 10px; font: inherit; border: 1px solid #ccc; }
      .required { color: #d00; }
      fieldset { border: 0; margin: 0; padding: 0; }
      legend { font: 22px Georgia, serif; margin: 24px 0 8px; }
      .array-button-remove { background: #e00; color: #fff; border: 0; width: 40px; height: 32px; }
      .daterangepicker-checkbox { margin-left: 38%; }
      .resume-section { border: 1px solid #eee; padding: 24px; margin: 16px 0; }
      .upload-resume-btn { background: #2d6ff3; color: #fff; border: 0; padding: 10px 60px; }
      .react-datepicker-wrapper { display: block; }
    </style>
  </head>
  <body class="apply-page">
    <div class="ph-generic-apply"><div id="root"></div></div>
    <pre id="state"></pre>
    <script src="build/phenom.js"></script>
  </body>
</html>
