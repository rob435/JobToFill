<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Apply for Summer Analyst 2027 – Northbridge Capital</title>
    <style>
      body {
        font: 15px/1.4 system-ui, sans-serif;
        margin: 32px auto;
        max-width: 760px;
      }
      section {
        border-top: 1px solid #ddd;
        margin: 24px 0;
        padding-top: 8px;
      }
      .field {
        margin: 14px 0;
      }
      .field > label,
      .field > .label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .field input:not([type='checkbox']):not([type='radio']),
      .field select {
        box-sizing: border-box;
        width: 100%;
        padding: 8px;
      }
      .field input[aria-invalid='true'] {
        border: 2px solid #c00;
      }
      .error {
        color: #c00;
        margin: 4px 0 0;
        font-size: 13px;
      }
      .hint {
        color: #555;
        font-size: 13px;
        margin: 0 0 4px;
      }
      #state {
        background: #f4f4f4;
        padding: 8px;
        font-size: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Apply for Summer Analyst 2027</h1>
    <p>Northbridge Capital · London · Summer Analyst Programme</p>
    <div id="root"></div>
    <script src="build/lib-forms.js"></script>
  </body>
</html>
