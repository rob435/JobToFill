<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tricky application form</title>
  <style>
    body { font: 14px system-ui; max-width: 640px; margin: 24px auto; }
    .q { margin: 14px 0; }
    .radio input { position: absolute; opacity: 0; }
    .radio span { display: inline-block; padding: 4px 10px; border: 1px solid #888; border-radius: 4px; margin-right: 6px; }
    .radio input:checked + span { background: #333; color: #fff; }
  </style>
</head>
<body>
  <h1>Apply now</h1>
  <form id="f">
    <div class="q"><label for="pre">First name</label><input id="pre" value="Augusta"></div>

    <div class="q"><label for="lastname">Last name</label><input id="lastname"></div>

    <!-- Honeypot: invisible to people, must never be filled -->
    <div style="position:absolute; left:-9999px; top:0"><label for="hp">Email</label><input id="hp" name="email_confirm_hp" tabindex="-1"></div>
    <div style="display:none"><label for="hidden_email">Email</label><input id="hidden_email" name="hidden_email"></div>

    <div class="q"><label for="realemail">Email address</label><input id="realemail" type="email"></div>

    <div class="q">
      <p>Are you at least 18 years of age?</p>
      <label class="radio"><input type="radio" name="age" value="y"><span>Yes</span></label>
      <label class="radio"><input type="radio" name="age" value="n"><span>No</span></label>
    </div>

    <div class="q">
      <p>Which languages do you speak?</p>
      <label><input type="checkbox" name="langs" value="en"> English</label>
      <label><input type="checkbox" name="langs" value="fr"> French</label>
      <label><input type="checkbox" name="langs" value="es"> Spanish</label>
    </div>

    <div class="q"><label><input type="checkbox" id="auth" name="auth"> I am legally authorized to work in the United States</label></div>
    <div class="q"><label><input type="checkbox" id="terms" name="terms"> I agree to the privacy policy</label></div>

    <table>
      <tr><td>Postal code</td><td><input name="f9" id="table_zip"></td></tr>
    </table>

    <p class="q">City: <input name="x1" id="inline_city"> State: <input name="x2" id="inline_state"></p>

    <div class="q"><label for="country_default">Country</label>
      <select id="country_default"><option value="CA" selected>Canada</option><option value="US">United States</option></select></div>

    <div class="q"><label for="salary">Desired salary</label>
      <select id="salary"><option value="">Choose a range</option><option>$50k-$80k</option><option>$80k-$120k</option><option>$120k-$160k</option><option>$160k+</option></select></div>

    <div class="q"><label for="yoe">Years of experience</label>
      <select id="yoe"><option value="">Select</option><option>0-1</option><option>1-3</option><option>3-5</option><option>5-10</option><option>10+</option></select></div>

    <div class="q"><label for="dob">Date of birth</label><input type="date" id="dob"></div>
    <div class="q"><label for="start">When can you start?</label><input type="date" id="start"></div>

    <div class="q"><label for="fav">What is your favourite programming language?</label><input id="fav"></div>
    <div class="q"><label for="tw">Twitter</label><input id="tw"></div>
    <!-- Maven's follow-up box: for the subject the list lacks, N/A otherwise -->
    <div class="q"><label for="subject">Degree subject</label><select id="subject"><option value="">Select…</option><option>Computer Science</option><option>Mathematics</option><option>Other</option></select></div>
    <div class="q"><label for="subject_other">If you selected 'Other' for the above question, please specify here or write N/A if you selected another answer</label><input id="subject_other"></div>
  </form>
</body>
</html>
