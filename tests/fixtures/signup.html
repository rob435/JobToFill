<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Create Account - Careers</title>
  <style>body { font: 14px system-ui; max-width: 420px; margin: 24px auto; } label { display: block; margin: 10px 0; } input { display: block; width: 100%; }</style>
</head>
<body>
  <h1>Create your candidate account</h1>
  <form id="signup">
    <label>Email Address <input type="email" name="email" id="email"></label>
    <label>Password <input type="password" name="password" id="password" autocomplete="new-password"></label>
    <label>Verify New Password <input type="password" name="password2" id="password2"></label>
    <label><input type="checkbox" id="terms" name="terms"> I agree to the terms and conditions</label>
    <button type="submit">Create Account</button>
  </form>
</body>
</html>
