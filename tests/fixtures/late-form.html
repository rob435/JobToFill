<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply</title>
    <!-- A single-page application that fetches its questions after loading: a spinner first, the form 1.2 s later. -->
    <style>
      body { font: 15px/1.4 system-ui, sans-serif; margin: 32px auto; max-width: 620px; }
      .spinner { width: 24px; height: 24px; border: 3px solid #ccd; border-top-color: #456; border-radius: 50%; }
      label { display: block; font-weight: 600; margin-top: 12px; }
    </style>
  </head>
  <body>
    <div id="app"><div class="spinner" aria-busy="true" aria-label="Loading"></div></div>
    <script>
      setTimeout(() => {
        document.getElementById('app').innerHTML = `
          <h1>Software Engineer Intern</h1>
          <form onsubmit="return false">
            <label for="first">First name</label><input id="first" />
            <label for="last">Last name</label><input id="last" />
            <label for="email">Email</label><input id="email" type="email" />
          </form>`;
      }, 1200);
    </script>
  </body>
</html>
