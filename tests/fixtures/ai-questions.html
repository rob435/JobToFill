<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rates Summer Analyst 2027 - Acme Capital</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "JobPosting",
        "title": "Rates Summer Analyst 2027",
        "hiringOrganization": { "@type": "Organization", "name": "Acme Capital" },
        "jobLocation": { "@type": "Place", "address": { "addressLocality": "London", "addressCountry": "GB" } },
        "identifier": { "@type": "PropertyValue", "value": "AC-2027-RATES" },
        "description": "<p>Acme Capital's Rates desk makes markets in government bonds and interest rate swaps for pension funds and insurers across Europe. As a Rates Summer Analyst you will spend ten weeks on the desk in London, working alongside traders and strats.</p><h3>What you will do</h3><ul><li>Build and maintain pricing and risk tools in Python used by the desk every day</li><li>Reconcile trades and positions with operations and explain breaks to traders</li><li>Analyse client flows and present one idea to the desk at the end of the summer</li><li>Learn how swaps, gilts and inflation-linked bonds are priced and hedged</li></ul><h3>What we look for</h3><ul><li>A penultimate-year student in a quantitative subject, graduating in 2028</li><li>Programming experience, ideally in Python</li><li>Clear communication and care with detail under time pressure</li><li>Curiosity about markets and how they move</li></ul><p>We value ownership, straight talking and helping each other learn. The programme runs from June to August 2027 and the best analysts are offered graduate roles on the desk.</p>"
      }
    </script>
  </head>
  <body>
    <h1>Rates Summer Analyst 2027</h1>
    <form id="application">
      <h2>Your details</h2>
      <label for="first_name">First name</label><input id="first_name" name="first_name" />
      <label for="last_name">Last name</label><input id="last_name" name="last_name" />
      <label for="email">Email</label><input id="email" type="email" name="email" />

      <h2>Questions</h2>
      <label for="why">Why do you want to join Acme Capital's Rates desk? (150 words max)</label>
      <textarea id="why" name="why"></textarea>

      <label for="python">Do you have practical Python experience?</label>
      <select id="python" name="python">
        <option value="">Select...</option>
        <option>Yes</option>
        <option>No</option>
      </select>

      <fieldset>
        <legend>Which product interests you most?</legend>
        <label><input type="radio" name="desk" value="rates" /> Rates and inflation</label>
        <label><input type="radio" name="desk" value="credit" /> Credit</label>
        <label><input type="radio" name="desk" value="equities" /> Equities</label>
      </fieldset>

      <label for="hear">How did you hear about Acme Capital?</label>
      <select id="hear" name="hear">
        <option value="">Select...</option>
        <option>Employee referral</option>
        <option>Online job board</option>
        <option>Careers fair</option>
        <option>Other</option>
      </select>

      <label for="sat">SAT score</label>
      <select id="sat" name="sat">
        <option value="">Select...</option>
        <option>Did not take</option>
        <option>1500 or above</option>
        <option>Below 1500</option>
      </select>

      <h2>A few more</h2>
      <label for="ses">Do you consider yourself to be from a lower socio-economic background?</label>
      <select id="ses" name="ses">
        <option value="">Select...</option>
        <option>Yes</option>
        <option>No</option>
        <option>Prefer not to say</option>
      </select>

      <label for="convicted">Have you ever been convicted of a criminal offence?</label>
      <select id="convicted" name="convicted">
        <option value="">Select...</option>
        <option>Yes</option>
        <option>No</option>
      </select>

      <label><input type="checkbox" id="privacy" name="privacy" /> I agree to the privacy notice</label>

      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
