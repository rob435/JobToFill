<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rates Summer Analyst 2027 - Acme Capital</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "JobPosting",
        "title": "Rates Summer Analyst 2027",
        "hiringOrganization": { "@type": "Organization", "name": "Acme Capital" },
        "jobLocation": { "@type": "Place", "address": { "addressLocality": "London", "addressCountry": "GB" } },
        "identifier": { "@type": "PropertyValue", "value": "AC-2027-RATES" },
        "description": "<p>Acme Capital's Rates desk makes markets in government bonds and interest rate swaps for pension funds and insurers across Europe. As a Rates Summer Analyst you will spend ten weeks on the desk in London, building pricing and risk tools in Python used by the desk every day.</p><p>Offers are subject to background and credit checks.</p>"
      }
    </script>
  </head>
  <body>
    <h1>Rates Summer Analyst 2027</h1>
    <form id="application">
      <h2>Your details</h2>
      <label for="first_name">First name</label><input id="first_name" name="first_name" />
      <label for="last_name">Last name</label><input id="last_name" name="last_name" />
      <label for="email">Email</label><input id="email" type="email" name="email" />
      <label for="dob">Date of birth</label><input id="dob" name="dob" />

      <label for="why">Why do you want to join Acme Capital's Rates desk? (150 words max)</label>
      <textarea id="why" name="why"></textarea>

      <h2>Screening</h2>
      <label for="official">Are you, or is any member of your immediate family, a current or former government official?</label>
      <select id="official" name="official">
        <option value="">Select...</option>
        <option>Yes</option>
        <option>No</option>
      </select>

      <label for="convicted">Have you ever been convicted of a criminal offence?</label>
      <select id="convicted" name="convicted">
        <option value="">Select...</option>
        <option>Yes</option>
        <option>No</option>
      </select>

      <label for="adjustments">Do you require any reasonable adjustments during the recruitment process?</label>
      <select id="adjustments" name="adjustments">
        <option value="">Select...</option>
        <option>Yes</option>
        <option>No</option>
      </select>

      <label for="ni">National Insurance number</label><input id="ni" name="ni" />
      <label for="passport">Passport number</label><input id="passport" name="passport" />

      <h2>Equal opportunities</h2>
      <label for="orientation">What is your sexual orientation?</label>
      <select id="orientation" name="orientation">
        <option value="">Select...</option>
        <option>Heterosexual or straight</option>
        <option>Gay or lesbian</option>
        <option>Bisexual</option>
        <option>I don't wish to answer</option>
      </select>

      <h2>Declaration</h2>
      <label for="signature">Signature</label><input id="signature" name="signature" />
      <label><input type="checkbox" id="updates" name="updates" /> Keep me updated about future opportunities at Acme Capital</label>

      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
