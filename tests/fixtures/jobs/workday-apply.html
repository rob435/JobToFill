    <meta
      name="description"
      property="og:description"
      content="Please only apply for one internship position, choosing the role that best matches your skills and interests. We'll consider your application across all of our research opportunities where appropriate. We tackle the most complex problems in quantitative finance, by bringing scientific clarity to financial complexity. From our London HQ, we unite world-class researchers and engineers in an environment that values deep exploration and methodical execution - because the best ideas take time to evolve. Together we’re building a world-class platform to amplify our teams’ most powerful ideas. Join a research team where curiosity meets scale. You’ll investigate foundational questions, uncover market insights and push the boundaries of what's possible - all with the support of near-limitless compute and world-class peers. Take the next step in your career. The role 10-week summer programme (21st June - 27th August 2027) 09:00-17:30 working hours Based in Central London Over the course of 10 weeks, G-Research Summer Research Programme interns gain a unique insight into life as a Quantitative Researcher at a leading quantitative finance research firm. You will be given a meaningful and challenging research project that demands the application of innovative yet pragmatic mathematical and computational analysis. Using rigorous scientific methodology, robust statistical analysis and pattern recognition, you will extract meaningful predictive signals from financial time-series and use these to predict future dynamics. Your project will give you the opportunity to use a wide range of techniques in areas such as mathematical modelling, deep learning, optimisation and machine learning in a practical and challenging context. Additional work may involve the implementation of back-testing frameworks to ensure signal robustness or the creation of a pipeline which constructs and simulates the performance of a portfolio derived from various input signals. Throughout the internship, you will collaborate closely with a Quantitative Researcher who will mentor you as you complete your independent project. You will receive structured feedback and reviews to help you to improve and develop, culminating in a final presentation of your research ideas to senior management. Taking part in G-Research's Summer Internship Programme will give you an in-depth insight into our academic approach to quantitative finance. You will also have the opportunity to explore London and get to know your fellow interns and colleagues through a full itinerary of social events. Top performers on the internship will be considered for full-time opportunities on completion of their studies. Who are we looking for? The ideal candidate will have the following skills and experience: Strong mathematical background Intermediate level of programming in at least one object-oriented language, ideally Python or C# Interest in applying data science, machine learning and optimisation techniques to real-world problems Be in the final or penultimate year of a Masters or PhD in a highly technical or quantitative subject such as Mathematics, Physics, Statistics, Engineering or Computer Science, with a PhD preferred Active GitHub or Kaggle profiles are desirable but not essential Previous experience in finance is not required, but an interest in finance and a willingness to learn are essential Why should you apply? Highly competitive compensation plus accommodation G-Research community with weekly intern activities Lunch provided (via Just Eat for Business) and dedicated barista bar 30 days’ annual leave pro-rated Informal dress code and excellent work/life balance Central London office close to 5 stations and 6 tube lines G-Research is committed to cultivating and preserving an inclusive work environment. We are an ideas-driven business and we place great value on diversity of experience and opinions. We want to ensure that applicants receive a recruitment experience that enables them to perform at their best. If you have a disability or special need that requires accommodation please let us know in the relevant section At G-Research, we are passionate about the intersection of finance, technology, and the future. We offer a dynamic, flexible and highly stimulating culture where world-beating ideas are cultivated and rewarded. We are proud to employ some of the best people in their field and to nurture their talent in our collaborative working environment."
    />
