<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply for Summer Analyst 2027 – Northbridge Capital Careers</title>
    <style>
      /* Tailwind-like utility look, written out: the widgets themselves are unstyled (Headless UI, Downshift). */
      * {
        box-sizing: border-box;
      }
      body {
        font: 15px/1.5 system-ui, sans-serif;
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
      }
      main {
        max-width: 720px;
        margin: 32px auto;
        padding: 0 16px;
      }
      h2 {
        font-size: 17px;
        margin: 28px 0 8px;
        border-bottom: 1px solid #e2e8f0;
        padding-bottom: 4px;
      }
      .row {
        display: flex;
        gap: 16px;
      }
      .row > .field {
        flex: 1;
      }
      .field {
        margin: 12px 0;
        position: relative;
      }
      .label {
        display: block;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 4px;
      }
      .input,
      .button {
        display: block;
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #fff;
        font: inherit;
        text-align: left;
        cursor: pointer;
        min-height: 40px;
      }
      .input.bare {
        border: 0;
        width: auto;
        flex: 1;
        min-height: 0;
        padding: 4px;
      }
      .options,
      .menu {
        background: #fff;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.15);
        list-style: none;
        margin: 4px 0 0;
        padding: 4px;
        max-height: 240px;
        overflow: auto;
        z-index: 20;
      }
      .options {
        width: var(--button-width, var(--input-width));
        --anchor-gap: 4px;
      }
      .options.virtual {
        width: var(--input-width);
        height: 240px;
      }
      .empty-invisible:empty {
        visibility: hidden;
      }
      .menu {
        position: absolute;
        left: 0;
        right: 0;
      }
      .hidden {
        display: none;
      }
      .option {
        padding: 6px 10px;
        border-radius: 4px;
        cursor: default;
      }
      .option[data-focus],
      .option.highlighted {
        background: #dbeafe;
      }
      .option[data-selected],
      .option.selected {
        font-weight: 600;
      }
      .muted {
        color: #64748b;
        padding: 6px 10px;
      }
      .chips-box {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #fff;
        padding: 6px;
      }
      .chip {
        background: #e2e8f0;
        border-radius: 999px;
        padding: 2px 10px;
      }
      .chip-remove {
        margin-left: 6px;
        cursor: pointer;
      }
      .radios {
        display: flex;
        gap: 20px;
      }
      .radio-row,
      .check-row,
      .switch-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .switch-row .label {
        margin: 0;
      }
      .radio {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1px solid #94a3b8;
        background: #fff;
        cursor: pointer;
      }
      .radio[data-checked] {
        background: #2563eb;
        box-shadow: inset 0 0 0 4px #fff;
      }
      .checkbox {
        display: inline-block;
        width: 18px;
        height: 18px;
        border-radius: 4px;
        border: 1px solid #94a3b8;
        background: #fff;
        cursor: pointer;
      }
      .checkbox[data-checked] {
        background: #2563eb;
        color: #fff;
      }
      .tick {
        display: block;
        width: 16px;
        height: 16px;
        opacity: 0;
      }
      .checkbox[data-checked] .tick {
        opacity: 1;
      }
      .switch {
        position: relative;
        width: 44px;
        height: 24px;
        border-radius: 999px;
        background: #cbd5e1;
        border: 0;
        cursor: pointer;
      }
      .switch[data-checked] {
        background: #2563eb;
      }
      .knob {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s;
      }
      .switch[data-checked] .knob {
        transform: translateX(20px);
      }
      .submit {
        margin-top: 24px;
        padding: 10px 18px;
        border: 0;
        border-radius: 6px;
        background: #0f172a;
        color: #fff;
        font: inherit;
      }
      #state {
        background: #f1f5f9;
        padding: 8px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Apply for Summer Analyst 2027</h1>
      <p>Northbridge Capital · New York, NY · Internship</p>
      <div id="root"></div>
      <pre id="state"></pre>
    </main>
    <script src="build/lib-headless.js"></script>
  </body>
</html>
