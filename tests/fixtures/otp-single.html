<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Two-step verification – Careers</title>
  <style>body { font: 15px/1.4 system-ui; max-width: 420px; margin: 24px auto; } label { display: block; margin: 10px 0 4px; } input { display: block; width: 100%; }</style>
</head>
<body>
  <h1>Check your inbox</h1>
  <form id="verify">
    <p>We sent a verification code to your email address. It expires in 10 minutes.</p>
    <label for="code">Verification code</label>
    <input type="text" id="code" name="code" autocomplete="one-time-code" inputmode="numeric" maxlength="6">
    <button type="submit">Continue</button>
  </form>
</body>
</html>
