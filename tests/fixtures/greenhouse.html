<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Senior Engineer at Acme - Greenhouse-style application</title>
  <style>
    body { font: 14px system-ui; max-width: 720px; margin: 24px auto; }
    .field { margin: 10px 0; display: grid; gap: 4px; }
    fieldset { margin: 16px 0; }
  </style>
</head>
<body>
  <h1>Apply for Senior Engineer</h1>
  <form id="application_form">
    <div class="field"><label for="first_name">First Name <span class="asterisk">*</span></label>
      <input type="text" id="first_name" name="job_application[first_name]"></div>
    <div class="field"><label for="last_name">Last Name <span class="asterisk">*</span></label>
      <input type="text" id="last_name" name="job_application[last_name]"></div>
    <div class="field"><label for="email">Email <span class="asterisk">*</span></label>
      <input type="text" id="email" name="job_application[email]"></div>
    <div class="field"><label for="phone">Phone</label>
      <input type="text" id="phone" name="job_application[phone]"></div>
    <div class="field"><label for="job_application_location">Location (City)</label>
      <input type="text" id="job_application_location" name="job_application[location]" autocomplete="off"></div>
    <div class="field"><label for="resume">Resume/CV <span class="asterisk">*</span></label>
      <input type="file" id="resume" name="job_application[resume]"></div>
    <div class="field"><label for="cover_letter">Cover Letter</label>
      <input type="file" id="cover_letter" name="job_application[cover_letter]"></div>

    <div class="field"><label for="q_linkedin">LinkedIn Profile</label>
      <input type="text" id="q_linkedin" name="job_application[answers_attributes][0][text_value]"></div>
    <div class="field"><label for="q_website">Website</label>
      <input type="text" id="q_website" name="job_application[answers_attributes][1][text_value]"></div>
    <div class="field"><label for="q_source">How did you hear about this job?</label>
      <select id="q_source" name="job_application[answers_attributes][2][answer_selected_options_attributes][0][question_option_id]">
        <option value="">--</option><option value="11">Indeed</option><option value="12">LinkedIn</option><option value="13">Company website</option><option value="14">Referral</option>
      </select></div>
    <div class="field"><label for="q_auth">Are you legally authorized to work in the United States?</label>
      <select id="q_auth" name="job_application[answers_attributes][3][boolean_value]"><option value="">--</option><option value="1">Yes</option><option value="0">No</option></select></div>
    <div class="field"><label for="q_sponsor">Will you now or in the future require sponsorship for employment visa status (e.g., H-1B visa status)?</label>
      <select id="q_sponsor" name="job_application[answers_attributes][4][boolean_value]"><option value="">--</option><option value="1">Yes</option><option value="0">No</option></select></div>
    <div class="field"><label for="q_why">Why do you want to work at Acme?</label>
      <textarea id="q_why" name="job_application[answers_attributes][5][text_value]"></textarea></div>

    <fieldset id="education_section">
      <legend>Education</legend>
      <div class="field"><label for="school">School</label><input type="text" id="school" name="job_application[educations][][school_name]"></div>
      <div class="field"><label for="degree">Degree</label>
        <select id="degree" name="job_application[educations][][degree_id]">
          <option value="">--</option><option value="1">High School</option><option value="2">Associate's Degree</option><option value="3">Bachelor's Degree</option>
          <option value="4">Master's Degree</option><option value="5">Master of Business Administration (M.B.A.)</option><option value="6">Doctor of Philosophy (Ph.D.)</option>
        </select></div>
      <div class="field"><label for="discipline">Discipline</label>
        <select id="discipline" name="job_application[educations][][discipline_id]">
          <option value="">--</option><option>Computer Science</option><option>Mathematics</option><option>Physics</option>
        </select></div>
      <div class="field"><label>Start Date</label>
        <div><input type="text" placeholder="MM" maxlength="2" id="edu_start_month" name="job_application[educations][][start_date][month]">
          <input type="text" placeholder="YYYY" maxlength="4" id="edu_start_year" name="job_application[educations][][start_date][year]"></div></div>
      <div class="field"><label>End Date</label>
        <div><input type="text" placeholder="MM" maxlength="2" id="edu_end_month" name="job_application[educations][][end_date][month]">
          <input type="text" placeholder="YYYY" maxlength="4" id="edu_end_year" name="job_application[educations][][end_date][year]"></div></div>
    </fieldset>

    <fieldset id="eeoc_fields">
      <legend>U.S. Equal Employment Opportunity information</legend>
      <div class="field"><label for="gender">Gender</label>
        <select id="gender" name="job_application[gender]"><option value="">Please select</option><option value="1">Male</option><option value="2">Female</option><option value="3">Decline To Self Identify</option></select></div>
      <div class="field"><label for="hispanic">Are you Hispanic/Latino?</label>
        <select id="hispanic" name="job_application[hispanic_ethnicity]"><option value="">Please select</option><option value="Yes">Yes</option><option value="No">No</option><option value="Decline">Decline To Self Identify</option></select></div>
      <div class="field"><label for="veteran">Veteran Status</label>
        <select id="veteran" name="job_application[veteran_status]"><option value="">Please select</option><option value="1">I am not a protected veteran</option><option value="2">I identify as one or more of the classifications of protected veteran</option><option value="3">I don't wish to answer</option></select></div>
      <div class="field"><label for="disability">Disability Status</label>
        <select id="disability" name="job_application[disability_status]"><option value="">Please select</option><option value="1">Yes, I have a disability (or previously had a disability)</option><option value="2">No, I don't have a disability</option><option value="3">I don't wish to answer</option></select></div>
    </fieldset>

    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
