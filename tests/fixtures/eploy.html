<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Associate Consultant Summer Internship 2027 (London Office) – OC&amp;C Strategy Consultants UK</title>
    <style>
      body { font: 15px/1.4 system-ui, sans-serif; margin: 32px auto; max-width: 680px; }
      .form-group { margin: 0 0 16px; }
      label { display: block; font-weight: 600; margin-bottom: 4px; }
      input[type='text'], input[type='email'] { padding: 6px; width: 320px; }
      .fancybox-overlay { position: fixed; inset: 0; background: #0006; display: flex; align-items: center; justify-content: center; }
      .fancybox-wrap { background: #fff; padding: 16px; width: 520px; }
      .fancybox-wrap iframe { width: 100%; height: 260px; border: 0; }
      #state { background: #f4f4f4; padding: 8px; font-size: 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <!--
      Eploy (OC&C's careers site): the CV goes in through "Upload CV", a link (href="#") that opens a fancybox dialog
      holding UploadFile.aspx in a frame: a file box and an "Upload File" submit button that sends it. JobToFill never
      presses that button, so the dialog is closed again (with its Close button: Escape doesn't) and the upload left for
      you; the rest of the form is filled.
    -->
    <h1>Associate Consultant Summer Internship 2027 (London Office)</h1>
    <form id="registration" onsubmit="return false">
      <h2>Create a new profile</h2>
      <div class="form-group">
        <label for="ctl00_Forenames">Forenames<span class="required">*</span></label>
        <input type="text" id="ctl00_Forenames" name="ctl00$Forenames" maxlength="50" />
      </div>
      <div class="form-group">
        <label for="ctl00_Surname">Surname<span class="required">*</span></label>
        <input type="text" id="ctl00_Surname" name="ctl00$Surname" maxlength="50" />
      </div>
      <div class="form-group">
        <label for="ctl00_Email">Email<span class="required">*</span></label>
        <input type="email" id="ctl00_Email" name="ctl00$Email" />
      </div>
      <div class="form-group">
        <label>CV<span class="required">*</span></label>
        <a href="#" id="upload-cv" onclick="OpenBox('UploadFile'); return false;">Upload CV</a>
        <span id="cv-name">No file uploaded</span>
      </div>
      <button type="submit">Register</button>
    </form>
    <pre id="state"></pre>
    <script>
      const UPLOAD_PAGE = `<!doctype html><html lang="en-GB"><body><form onsubmit="parent.uploaded(this); return false">
        <h1>Upload File</h1><p>Please select a file and then activate the Upload File button</p>
        <h2>Upload file from my computer</h2>
        <label for="file">label</label><input type="file" id="file" aria-label="Select or drop file here" />
        <p>Allowed File Extensions: .doc, .docx, .txt, .rtf, .pdf, .wps, .odt</p>
        <button type="submit" name="cancel">Cancel</button> <button type="submit" id="go" disabled>Upload File</button>
        <script>document.getElementById('file').addEventListener('change', () => (document.getElementById('go').disabled = false));<\/script>
      </form></body></html>`;
      let overlay = null;
      function OpenBox() {
        overlay = document.createElement('div');
        overlay.className = 'fancybox-overlay';
        overlay.innerHTML = `<div class="fancybox-wrap" role="dialog" aria-modal="true" aria-labelledby="fb-title"><h2 id="fb-title">UPLOAD FILE</h2><iframe title="Upload CV"></iframe><button type="button" class="fancybox-close" title="Close" aria-label="Close">×</button></div>`;
        overlay.querySelector('iframe').srcdoc = UPLOAD_PAGE;
        overlay.querySelector('.fancybox-close').addEventListener('click', close);
        document.body.append(overlay);
      }
      function close() {
        if (overlay) overlay.remove();
        overlay = null;
        show();
      }
      window.uploaded = (form) => {
        const f = form.querySelector('input[type=file]').files[0];
        document.getElementById('cv-name').textContent = f ? f.name : 'No file uploaded';
        close();
      };
      // Opened as a modal box: Escape does nothing, only its Close button shuts it.
      const show = () =>
        (document.getElementById('state').textContent = JSON.stringify({
          forenames: document.getElementById('ctl00_Forenames').value,
          surname: document.getElementById('ctl00_Surname').value,
          email: document.getElementById('ctl00_Email').value,
          cv: document.getElementById('cv-name').textContent,
          dialog: !!overlay,
        }));
      document.addEventListener('input', show);
      show();
    </script>
  </body>
</html>
